<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩优化 - Niur-DevTools</title>
    <link rel="stylesheet" href="styles/compressor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <header class="app-header">
        <nav class="nav-container">
            <div class="logo">
                <a href="./index.html">
                    <i class="bi bi-tools"></i>
                    Niur-DevTools
                </a>
            </div>
            <div class="nav-links">
                <a href="./index.html" class="nav-button">
                    <i class="bi bi-house"></i>
                    返回首页
                </a>
                <a href="https://github.com/yourusername/devtools" target="_blank" class="nav-button">
                    <i class="bi bi-github"></i>
                    GitHub
                </a>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="compressor-container">
            <div class="upload-area" id="dropZone">
                <i class="bi bi-cloud-arrow-up"></i>
                <h3>拖放图片到这里</h3>
                <p>或者</p>
                <button onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-images"></i> 选择图片（最多20张）
                </button>
                <div class="upload-tips">
                    <p>支持格式：JPG、PNG、WebP</p>
                </div>
                <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
            </div>

            <div class="settings-panel">
                <h3>压缩设置</h3>
                <div class="setting-item">
                    <label for="quality">压缩比例</label>
                    <div class="quality-control">
                        <input type="range" id="quality" min="10" max="90" value="80">
                        <span id="qualityValue">80%</span>
                        <span class="quality-tip">压缩掉原文件大小的 80%</span>
                    </div>
                </div>
                <div class="compress-actions">
                    <button id="startCompress" class="primary-btn">
                        <i class="bi bi-play-fill"></i> 开始压缩
                    </button>
                    <button id="downloadAll" class="secondary-btn" style="display: none;">
                        <i class="bi bi-download"></i> 下载全部
                    </button>
                </div>
            </div>

            <div class="images-list" id="imagesList">
                <!-- 图片列表将通过 JavaScript 动态生成 -->
            </div>
        </div>
    </div>

    <script src="scripts/compressor.js"></script>
</body>
</html>
