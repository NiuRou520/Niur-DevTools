<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格式转换工具 - Niur-DevTools</title>
    <link rel="stylesheet" href="styles/converter.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <!-- PDF.js 库用于PDF处理 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script>
        // 设置 PDF.js worker
        window.pdfjsLib = window['pdfjs-dist/build/pdf'];
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
    </script>
    <script>
        // 确保 jsPDF 正确初始化
        window.jspdf = window.jspdf || {};
    </script>
</head>
<body>
    <!-- 导航栏 -->
    <header class="app-header">
        <nav class="nav-container">
            <div class="logo">
                <a href="./index.html">
                    <i class="bi bi-tools"></i>
                    Niur-DevTools
                </a>
            </div>
            <div class="nav-links">
                <a href="./index.html" class="nav-button">
                    <i class="bi bi-house"></i>
                    返回首页
                </a>
                <a href="https://github.com/yourusername/devtools" target="_blank" class="nav-button">
                    <i class="bi bi-github"></i>
                    GitHub
                </a>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="converter-container">
            <!-- 文件上传区域 -->
            <div class="upload-area" id="dropZone">
                <i class="bi bi-cloud-arrow-up"></i>
                <h3>拖放文件到这里</h3>
                <p>或者</p>
                <button onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-file-earmark-arrow-up"></i> 选择文件
                </button>
                <div class="upload-tips">
                    <p>支持格式：JPG、PNG、WEBP、GIF、PDF</p>
                    <p>单个文件最大 50MB</p>
                </div>
                <input type="file" id="fileInput" multiple 
                    accept=".jpg,.jpeg,.png,.webp,.gif,.pdf" style="display: none;">
            </div>

            <!-- 转换设置 -->
            <div class="settings-panel">
                <h3>转换设置</h3>
                <div class="setting-item">
                    <label for="targetFormat">目标格式</label>
                    <select id="targetFormat" class="format-select">
                        <option value="jpeg">JPG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WEBP</option>
                        <option value="gif">GIF</option>
                        <option value="pdf">合并为PDF</option>
                    </select>
                </div>
                <div class="convert-actions">
                    <button id="startConvert" class="primary-btn" style="display: none;">
                        <i class="bi bi-arrow-repeat"></i> 开始转换
                    </button>
                    <button id="downloadAll" class="secondary-btn" style="display: none;">
                        <i class="bi bi-download"></i> 下载全部
                    </button>
                    <button id="clearAll" class="clear-btn">
                        <i class="bi bi-trash"></i> 清空
                    </button>
                </div>
            </div>

            <!-- 预览区域 -->
            <div class="preview-list" id="previewList">
                <!-- 预览内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <div id="errorMessage" style="display: none;"></div>
    <div id="loadingMessage" style="display: none;"></div>
    <div id="successMessage" style="display: none;"></div>

    <script src="scripts/converter.js"></script>
</body>
</html>
